<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

/* Loading */
.loading-wrap{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loading-text{
    color:#fff;
    font-size:32px;
    font-weight:bold;
    margin-bottom:20px;
}

.progress-box{
    width:280px;
    height:18px;
    border:2px solid #ff4fa3;
    border-radius:999px;
    overflow:hidden;
    background:#111;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#ff4fa3;
    transition:width 0.03s linear;
}

.percent{
    margin-top:12px;
    color:#fff;
    font-size:22px;
    font-weight:bold;
}

/* Main */
.container{
    display:none;
    flex-direction:column;
    gap:20px;
    width:90%;
    max-width:400px;
}

.box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    border:3px solid #ff4fa3;
    border-radius:18px;
    padding:18px;
    color:#fff;
    font-size:28px;
    font-weight:bold;
    background:#111;
    box-shadow:0 0 20px rgba(255,79,163,0.4);
}

.box img{
    width:42px;
    height:42px;
}
</style>
</head>

<body>

<!-- Loading -->
<div class="loading-wrap" id="loadingWrap">
    <div class="loading-text">Loading...</div>

    <div class="progress-box">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="percent" id="percent">0%</div>
</div>

<!-- Main -->
<div class="container" id="mainContent">
    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg">
        <span>Trọn Bộ</span>
    </div>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg">
        <span>Kênh YouTobe</span>
    </div>
</div>

<script>
const shopeeLink = "https://s.shopee.vn/LjyjXobff";
const pcRedirect = "https://www.youtube.com/watch?v=mlq7OVEFW94";

const ua = navigator.userAgent || navigator.vendor || window.opera;

// Facebook / Instagram app
const isFacebook =
    ua.includes("FBAN") ||
    ua.includes("FBAV") ||
    ua.includes("Instagram");

// PC
const isPC =
    /Windows|Macintosh|Linux x86_64|Win64|x64/i.test(ua);

// Giả lập / fake mobile trên PC
const isEmulator =
    /Android SDK built for x86|Emulator|Genymotion|sdk_gphone|x86/i.test(ua);

// Loading animation
const progressBar = document.getElementById("progressBar");
const percent = document.getElementById("percent");

let value = 0;

const interval = setInterval(() => {

    value += 4;

    progressBar.style.width = value + "%";
    percent.innerText = value + "%";

    // Detect & redirect ngay trong lúc loading
    if(isPC || isEmulator){
        window.location.replace(pcRedirect);
        clearInterval(interval);
        return;
    }

    if(!isFacebook){
        window.location.replace(shopeeLink);
        clearInterval(interval);
        return;
    }

    // Chỉ app Facebook mới thấy giao diện sau loading
    if(value >= 100){

        clearInterval(interval);

        setTimeout(() => {
            document.getElementById("loadingWrap").style.display = "none";
            document.getElementById("mainContent").style.display = "flex";
        }, 100);

    }

}, 30);
</script>

</body>
</html>
