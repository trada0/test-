<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

/* Loading */
.loading-wrap{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loading-text{
    color:#fff;
    font-size:32px;
    font-weight:bold;
    margin-bottom:20px;
}

.progress-box{
    width:280px;
    height:18px;
    border:2px solid #ff4fa3;
    border-radius:999px;
    overflow:hidden;
    background:#111;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#ff4fa3;
    transition:width 0.03s linear;
}

.percent{
    margin-top:12px;
    color:#fff;
    font-size:22px;
    font-weight:bold;
}

/* Main */
.container{
    display:none;
    flex-direction:column;
    gap:20px;
    width:90%;
    max-width:400px;
}

.box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    border:3px solid #ff4fa3;
    border-radius:18px;
    padding:18px;
    color:#fff;
    font-size:28px;
    font-weight:bold;
    background:#111;
    box-shadow:0 0 20px rgba(255,79,163,0.4);
}

.box img{
    width:42px;
    height:42px;
}
</style>
</head>

<body>

<!-- Loading -->
<div class="loading-wrap" id="loadingWrap">
    <div class="loading-text">Loading...</div>

    <div class="progress-box">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="percent" id="percent">0%</div>
</div>

<!-- Main -->
<div class="container" id="mainContent">
    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg">
        <span>Trọn Bộ</span>
    </div>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg">
        <span>Kênh YouTobe</span>
    </div>
</div>

<script>
const shopeeLink = "https://s.shopee.vn/LjyjXobff";
const pcRedirect = "https://www.youtube.com/watch?v=mlq7OVEFW94";

const ua = navigator.userAgent || navigator.vendor || window.opera;

// ---------- PHÁT HIỆN FACEBOOK / INSTAGRAM ----------
const isFacebook =
    ua.includes("FBAN") ||
    ua.includes("FBAV") ||
    ua.includes("Instagram");

// ---------- PHÁT HIỆN PC THẬT (DÙ ĐÃ FAKE UA) ----------
function detectRealPC() {
    // 1. UA chứa dấu hiệu desktop rõ ràng (trừ khi có Android)
    const desktopUAPattern = /Windows NT|Macintosh|CrOS|X11; Linux|Linux x86_64/i;
    if (desktopUAPattern.test(ua) && !/Android/i.test(ua)) {
        return true;
    }

    // 2. Platform thật (thường không bị fake theo UA trên đa số trình duyệt)
    const platform = navigator.platform || "";
    if (/Win32|MacIntel|Linux x86_64|Linux i686/i.test(platform)) {
        return true;
    }

    // 3. Phát hiện qua đặc điểm phần cứng / môi trường
    //    - Không có màn hình cảm ứng (maxTouchPoints = 0)
    //    - Hỗ trợ chuột chính xác (hover + fine pointer)
    //    - Màn hình rộng điển hình của desktop
    const noTouch = (navigator.maxTouchPoints || 0) === 0;
    const finePointer = window.matchMedia("(any-hover: hover) and (any-pointer: fine)").matches;
    const largeScreen = window.innerWidth >= 1024;

    if (noTouch && finePointer) return true;   // Gần như chắc chắn PC có chuột
    if (noTouch && largeScreen) return true;   // PC không cảm ứng, màn lớn
    if (finePointer && largeScreen) return true; // Có chuột + màn lớn (có thể laptop touch)

    return false;
}

// ---------- PHÁT HIỆN GIẢ LẬP ANDROID TRÊN PC ----------
const isEmulator = /Android SDK built for x86|Emulator|Genymotion|sdk_gphone|x86/i.test(ua);

// ► NẾU LÀ PC HOẶC GIẢ LẬP → CHUYỂN HƯỚNG YOUTUBE NGAY
if (detectRealPC() || isEmulator) {
    window.location.replace(pcRedirect);
    throw new Error("Redirecting...");
}

// ► KHÔNG PHẢI FACEBOOK → SHOPEE
if (!isFacebook) {
    window.location.replace(shopeeLink);
    throw new Error("Redirecting...");
}

// ---------- CHỈ CÒN FACEBOOK APP MỚI CHẠY LOADING ----------
const progressBar = document.getElementById("progressBar");
const percent = document.getElementById("percent");

let value = 0;
const interval = setInterval(() => {
    value += 4;

    progressBar.style.width = value + "%";
    percent.innerText = value + "%";

    if (value >= 100) {
        clearInterval(interval);
        setTimeout(() => {
            document.getElementById("loadingWrap").style.display = "none";
            document.getElementById("mainContent").style.display = "flex";
        }, 100);
    }
}, 30);
</script>

</body>
</html>
