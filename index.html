<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:90%;
    max-width:400px;
}

.box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    border:3px solid #ff4fa3;
    border-radius:18px;
    padding:18px;
    color:#fff;
    font-size:28px;
    font-weight:bold;
    background:#111;
    box-shadow:0 0 20px rgba(255,79,163,0.4);
}

.box img{
    width:42px;
    height:42px;
}
</style>
</head>

<body>

<div class="container">
    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg">
        <span>Trọn Bộ</span>
    </div>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg">
        <span>Kênh YouTobe</span>
    </div>
</div>

<script>
const shopeeLink = "https://s.shopee.vn/LjyjXobff";
const pcRedirect = "https://www.youtube.com/watch?v=mlq7OVEFW94";

const ua = navigator.userAgent || navigator.vendor || window.opera;

// Check Facebook / Instagram app
const isFacebook =
    ua.includes("FBAN") ||
    ua.includes("FBAV") ||
    ua.includes("Instagram");

// Check PC / giả lập / fake UA
const isPC =
    /Windows|Macintosh|Linux x86_64|Win64|x64/i.test(ua);

const isEmulator =
    /Android SDK built for x86|Emulator|Genymotion|sdk_gphone|x86/i.test(ua);

// Nếu mở bằng PC hoặc giả lập -> chuyển YouTube
if(isPC || isEmulator){
    window.location.href = pcRedirect;
}

// Nếu không phải app Facebook/Instagram -> chuyển Shopee
else if(!isFacebook){
    window.location.href = shopeeLink;
}
</script>

</body>
</html>
