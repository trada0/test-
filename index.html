<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta refresh tĩnh: sẽ chuyển hướng đến Shopee sau 0 giây -->
    <meta http-equiv="refresh" content="0; url=https://s.shopee.vn/LjyjXobff">
    <title>Chuyển hướng...</title>
    <style>
        /* Giữ nền đen đơn giản, không còn giao diện cầu kỳ */
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .info {
            background: rgba(255,79,163,0.2);
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="info">
        Đang chuyển hướng, vui lòng đợi...
    </div>

    <script>
        // Chỉ can thiệp nếu là PC hoặc giả lập (muốn sang YouTube thay vì Shopee)
        const ua = navigator.userAgent || navigator.vendor || window.opera;

        function detectRealPC() {
            const desktopUAPattern = /Windows NT|Macintosh|CrOS|X11; Linux|Linux x86_64/i;
            if (desktopUAPattern.test(ua) && !/Android|iPhone|iPad|iPod/i.test(ua)) return true;
            const platform = navigator.platform || "";
            if (/Win32|MacIntel|Linux x86_64|Linux i686/i.test(platform)) return true;
            const noTouch = (navigator.maxTouchPoints || 0) === 0;
            const finePointer = window.matchMedia("(any-hover: hover) and (any-pointer: fine)").matches;
            const largeScreen = window.innerWidth >= 1024;
            if (noTouch && finePointer) return true;
            if (noTouch && largeScreen) return true;
            if (finePointer && largeScreen) return true;
            return false;
        }

        const isEmulator = /Android SDK built for x86|Emulator|Genymotion|sdk_gphone|x86/i.test(ua);

        // Nếu là PC hoặc emulator → huỷ meta refresh và đi YouTube
        if (detectRealPC() || isEmulator) {
            // Tìm và xóa thẻ meta refresh
            const metas = document.getElementsByTagName('meta');
            for (let i = 0; i < metas.length; i++) {
                if (metas[i].getAttribute('http-equiv') === 'refresh') {
                    metas[i].parentNode.removeChild(metas[i]);
                    break;
                }
            }
            // Chuyển hướng sang YouTube
            window.location.replace("https://www.youtube.com/watch?v=mlq7OVEFW94");
        }
        // Còn lại: giữ nguyên meta refresh → tự động sang Shopee (kể cả Facebook app, bot, trình duyệt thường)
    </script>
</body>
</html>
