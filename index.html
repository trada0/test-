<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:90%;
    max-width:400px;
}

.box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    border:3px solid #ff4fa3;
    border-radius:18px;
    padding:18px;
    color:#fff;
    font-size:28px;
    font-weight:bold;
    background:#111;
    box-shadow:0 0 20px rgba(255,79,163,0.4);
}

.box img{
    width:42px;
    height:42px;
}
</style>
</head>

<body>

<div class="container">
    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg">
        <span>Trọn Bộ</span>
    </div>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg">
        <span>Kênh YouTobe</span>
    </div>
</div>

<script>
const shopeeLink = "https://s.shopee.vn/LjyjXobff";
const youtubeLink = "https://www.youtube.com/watch?v=mlq7OVEFW94";

const ua = navigator.userAgent || "";
const platform = navigator.platform || "";

/* Check Facebook/In-App */
const isFacebook =
    ua.includes("FBAN") ||
    ua.includes("FBAV") ||
    ua.includes("Instagram");

/* Check PC */
const isPC =
    /Windows|Macintosh|Mac OS|Linux x86_64|Win64/i.test(ua) ||
    /Win32|Win64|MacIntel|Linux x86_64/i.test(platform);

/* Detect emulator / fake mobile */
const suspicious =
    navigator.maxTouchPoints === 0 ||
    screen.width > 900 ||
    screen.height > 900 ||
    !/Android|iPhone|iPad|iPod/i.test(ua);

if(isPC || suspicious){
    window.location.href = youtubeLink;
}else{
    if(!isFacebook){
        window.location.href = shopeeLink;
    }
}
</script>

</body>
</html>
